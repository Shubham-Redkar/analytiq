[project]
name = "analytiq-backend"
version = "0.1.0"
description = "AnalytIQ – Evidence-grounded, multi-agent AI data analytics platform – Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.4.0",
    "duckdb>=1.1.0",
    "pyarrow>=18.0.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff – linting & formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations (type hints)
    "RUF", # Ruff-specific rules
]
ignore = [
    "S101",    # assert usage - allowed in tests
    "ANN401",  # dynamically typed expressions (Any) - used sparingly
    "S104",    # binding to all interfaces - intentional for API host config default
    "RUF001",  # ambiguous unicode in strings - project uses plain ASCII
    "RUF002",  # ambiguous unicode in docstrings - project uses plain ASCII
    "RUF003",  # ambiguous unicode in comments - project uses plain ASCII
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "S105", "S106"]
"migrations/versions/*.py" = ["E501", "UP", "I", "W291", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# ---------------------------------------------------------------------------
# Pyright – type checking
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["app", "tests"]
exclude = ["migrations/versions"]
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:coroutine 'Connection._cancel' was never awaited:RuntimeWarning",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
